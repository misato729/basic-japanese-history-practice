[build]
base = "frontend"
command = "npm run generate"
publish = ".output/public"

[build.environment]
NODE_VERSION = "24"
NITRO_PRESET = "static"
# Keep browser API calls independent of Netlify's generated SPA fallback order.
NUXT_PUBLIC_API_BASE = "https://basic-japanese-history-practice.fly.dev"

[[redirects]]
from = "/api/*"
to = "https://basic-japanese-history-practice.fly.dev/api/:splat"
status = 200
force = true
