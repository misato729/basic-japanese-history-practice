name: Daily production smoke

on:
  schedule:
    # 10:17 JST (01:17 UTC), once per day.
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-smoke.yml'
      - 'scripts/production-smoke.mjs'
      - 'scripts/production-smoke.test.mjs'

permissions:
  contents: read

concurrency:
  group: daily-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify smoke failure detection
        run: node --test scripts/production-smoke.test.mjs
      - name: Check production pages and APIs
        run: node scripts/production-smoke.mjs
