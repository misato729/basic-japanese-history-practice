# fly.toml app configuration file generated for basic-japanese-history-practice on 2026-11-06T08:35:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'basic-japanese-history-practice'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'production'

[deploy]
  release_command = 'npm run db:migrate'
  release_command_timeout = '15m0s'

[env]
  APP_ENV = 'production'
  BETTER_AUTH_URL = 'https://basic-japanese-history-practice.netlify.app'
  CORS_ORIGINS = 'https://basic-japanese-history-practice.netlify.app'
  FRONTEND_URL = 'https://basic-japanese-history-practice.netlify.app'
  NITRO_HOST = '0.0.0.0'
  NITRO_PORT = '3000'
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=512'
  NUXT_API_ONLY = 'true'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
